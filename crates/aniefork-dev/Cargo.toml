[package]
name = "gridcraft-aniefork-dev"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft Development subsystem (aniefork): projects, the user's trust in them, their Python scripts and their panels"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1"

# The bridge's tokens come from the operating system's source of randomness. The web build
# serves nothing, and so needs none.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"
# Looking inside a workbook's VBA project (`vba.rs`): the container it is kept in, and the code
# pages its text is stored in.
cfb = "0.15"
encoding_rs = "0.8"
# A development kit's package is a zip (`kitpack.rs`): the reader the workspace already has.
zip = { workspace = true }
# A setup (`setup.rs`) downloads a game's pinned code and data, on the person's Set Up alone:
# HTTPS with rustls and Mozilla's roots, so that no system library is linked. Nothing
# decompresses a response: what is checked is the bytes as they came.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
# Debian's archive of a game's data is a .tar.gz: the decoder `zip` already brings in.
flate2 = "1"
